[package]
name = "obv-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
obv-gpu = { path = "../obv-gpu" }
bytemuck.workspace = true
rayon = "1"
half = "2"
exr = "1"
# Textures des matériaux (couleur, métal-rugosité) : PNG, JPEG, WebP.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[build-dependencies]
obv-build = { path = "../obv-build" }

[lints]
workspace = true
