name: Version

# Construit Obview 3D pour Windows (x64) et macOS (Apple Silicon, KosmicKrisp), OpenCASCADE et Draco liés
# statiquement, et prépare un brouillon de version GitHub avec les deux archives. La publication reste un geste
# de l'utilisateur (D-28).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version (ex. 0.2.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    name: Windows (version)
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      VULKAN_SDK: C:\VulkanSDK
      OCCT_DIR: C:\occt
      OBV_REQUIRE_OCCT: "1"
      DRACO_DIR: C:\draco
      OBV_REQUIRE_DRACO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: sdk
        with:
          path: C:\VulkanSDK
          key: vulkan-sdk-1.4.335.0
      - name: SDK Vulkan (glslangValidator)
        if: steps.sdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://sdk.lunarg.com/sdk/download/1.4.335.0/windows/vulkansdk-windows-X64-1.4.335.0.exe"
          Invoke-WebRequest -Uri $url -OutFile vulkansdk.exe
          Start-Process -FilePath .\vulkansdk.exe -ArgumentList "--root C:\VulkanSDK --accept-licenses --default-answer --confirm-command install copy_only=1" -Wait -NoNewWindow
      - uses: actions/cache/restore@v4
        id: occt
        with:
          path: C:\occt
          key: occt-windows-${{ hashFiles('tools/occt.sh') }}
      - name: OpenCASCADE (statique, D-27)
        if: steps.occt.outputs.cache-hit != 'true'
        shell: bash
        run: |
          tools/occt.sh /c/occt
          rm -rf /c/occt-work
      - uses: actions/cache/save@v4
        if: steps.occt.outputs.cache-hit != 'true'
        with:
          path: C:\occt
          key: occt-windows-${{ hashFiles('tools/occt.sh') }}
      - uses: actions/cache/restore@v4
        id: draco
        with:
          path: C:\draco
          key: draco-windows-${{ hashFiles('tools/draco.sh') }}
      - name: Draco (statique, D-30)
        if: steps.draco.outputs.cache-hit != 'true'
        shell: bash
        run: |
          tools/draco.sh /c/draco
          rm -rf /c/draco-work
      - uses: actions/cache/save@v4
        if: steps.draco.outputs.cache-hit != 'true'
        with:
          path: C:\draco
          key: draco-windows-${{ hashFiles('tools/draco.sh') }}
      - name: Construction
        run: cargo build --release -p obview
      - name: Archive
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          $dir = "Obview-3D-$v-windows-x64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/obview.exe "$dir/Obview 3D.exe"
          New-Item -ItemType Directory "$dir/licences" | Out-Null
          Copy-Item crates/obv-ui/assets/fonts/OFL-geist.txt "$dir/licences/Geist-OFL.txt"
          Copy-Item C:\occt\licence\* "$dir/licences/"
          Copy-Item C:\draco\LICENSE-draco "$dir/licences/Draco-Apache-2.0.txt"
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: version-windows
          path: Obview-3D-*-windows-x64.zip

  macos:
    name: macOS Apple Silicon (version)
    runs-on: macos-26
    timeout-minutes: 300
    env:
      MACOSX_DEPLOYMENT_TARGET: "26.0"
      VULKAN_SDK_VERSION: 1.4.363.0
      OBV_REQUIRE_OCCT: "1"
      OBV_REQUIRE_DRACO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: sdk
        with:
          path: ~/VulkanSDK
          key: vulkan-sdk-macos-${{ env.VULKAN_SDK_VERSION }}
      - name: SDK Vulkan (chargeur, KosmicKrisp, glslangValidator)
        if: steps.sdk.outputs.cache-hit != 'true'
        run: tools/macos-sdk.sh "$VULKAN_SDK_VERSION" ~/VulkanSDK
      - name: Outils et variables
        run: |
          brew install ninja || true
          echo "VULKAN_SDK=$HOME/VulkanSDK/macOS" >> "$GITHUB_ENV"
          echo "OCCT_DIR=$HOME/occt" >> "$GITHUB_ENV"
          echo "DRACO_DIR=$HOME/draco" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        id: occt
        with:
          path: ~/occt
          key: occt-macos-${{ hashFiles('tools/occt.sh') }}
      - name: OpenCASCADE (statique, D-27)
        if: steps.occt.outputs.cache-hit != 'true'
        run: |
          OCCT_JOBS=$(sysctl -n hw.ncpu) tools/occt.sh ~/occt
          rm -rf ~/occt-work
      - uses: actions/cache/save@v4
        if: steps.occt.outputs.cache-hit != 'true'
        with:
          path: ~/occt
          key: occt-macos-${{ hashFiles('tools/occt.sh') }}
      - uses: actions/cache/restore@v4
        id: draco
        with:
          path: ~/draco
          key: draco-macos-${{ hashFiles('tools/draco.sh') }}
      - name: Draco (statique, D-30)
        if: steps.draco.outputs.cache-hit != 'true'
        run: |
          tools/draco.sh ~/draco
          rm -rf ~/draco-work
      - uses: actions/cache/save@v4
        if: steps.draco.outputs.cache-hit != 'true'
        with:
          path: ~/draco
          key: draco-macos-${{ hashFiles('tools/draco.sh') }}
      - name: Construction
        run: cargo build --release -p obview
      - name: Application et archive
        run: |
          v="${{ inputs.version }}"
          tools/macos-app.sh target/release/obview "$v" "$VULKAN_SDK" dist
          ditto -c -k --keepParent "dist/Obview 3D.app" "Obview-3D-$v-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: version-macos
          path: Obview-3D-*-macos-arm64.zip

  brouillon:
    name: Brouillon de version
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: archives
          merge-multiple: true
      - name: Brouillon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ inputs.version }}"
          gh release create "v$v" archives/*.zip --draft --target "$GITHUB_SHA" --title "Obview 3D $v" \
            --notes-file docs/notes-version.md
