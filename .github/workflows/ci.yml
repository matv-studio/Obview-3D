name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    name: Linux (lavapipe, llvmpipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Vulkan et OpenGL logiciels, compilateur de shaders
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers glslang-tools vulkan-tools vulkan-validationlayers \
            libegl1 libegl-mesa0 libgl1-mesa-dri ninja-build
          vulkaninfo --summary | grep -E "deviceName|apiVersion|driverInfo"
      - uses: actions/cache/restore@v4
        id: occt
        with:
          path: ~/occt
          key: occt-linux-${{ hashFiles('tools/occt.sh') }}
      - name: OpenCASCADE (statique, D-27)
        if: steps.occt.outputs.cache-hit != 'true'
        run: |
          tools/occt.sh ~/occt
          rm -rf ~/occt-work
      # Gardé dès sa construction, même si une étape suivante échoue.
      - uses: actions/cache/save@v4
        if: steps.occt.outputs.cache-hit != 'true'
        with:
          path: ~/occt
          key: occt-linux-${{ hashFiles('tools/occt.sh') }}
      - uses: actions/cache/restore@v4
        id: draco
        with:
          path: ~/draco
          key: draco-linux-${{ hashFiles('tools/draco.sh') }}
      - name: Draco (statique, D-30)
        if: steps.draco.outputs.cache-hit != 'true'
        run: |
          tools/draco.sh ~/draco
          rm -rf ~/draco-work
      - uses: actions/cache/save@v4
        if: steps.draco.outputs.cache-hit != 'true'
        with:
          path: ~/draco
          key: draco-linux-${{ hashFiles('tools/draco.sh') }}
      - name: Variables des bibliothèques
        run: |
          echo "OCCT_DIR=$HOME/occt" >> "$GITHUB_ENV"
          echo "OBV_REQUIRE_OCCT=1" >> "$GITHUB_ENV"
          echo "DRACO_DIR=$HOME/draco" >> "$GITHUB_ENV"
          echo "OBV_REQUIRE_DRACO=1" >> "$GITHUB_ENV"
          echo "OBV_REQUIRE_GL=1" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'tools/occt.sh', 'tools/draco.sh') }}
      - name: Format
        run: cargo fmt --all --check
      - name: Analyse (clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Essais
        run: cargo test --workspace
      - name: Rendus des essais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendus-linux
          path: target/tmp/rendus
          if-no-files-found: ignore

  windows:
    name: Windows (construction)
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      VULKAN_SDK: C:\VulkanSDK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: sdk
        with:
          path: C:\VulkanSDK
          key: vulkan-sdk-1.4.335.0
      - name: SDK Vulkan (glslangValidator)
        if: steps.sdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://sdk.lunarg.com/sdk/download/1.4.335.0/windows/vulkansdk-windows-X64-1.4.335.0.exe"
          Invoke-WebRequest -Uri $url -OutFile vulkansdk.exe
          Start-Process -FilePath .\vulkansdk.exe -ArgumentList "--root C:\VulkanSDK --accept-licenses --default-answer --confirm-command install copy_only=1" -Wait -NoNewWindow
          Get-ChildItem C:\VulkanSDK\Bin\glslangValidator.exe
      - uses: actions/cache/restore@v4
        id: occt
        with:
          path: C:\occt
          key: occt-windows-${{ hashFiles('tools/occt.sh') }}
      - name: OpenCASCADE (statique, D-27)
        if: steps.occt.outputs.cache-hit != 'true'
        shell: bash
        run: |
          tools/occt.sh /c/occt
          rm -rf /c/occt-work
      - uses: actions/cache/save@v4
        if: steps.occt.outputs.cache-hit != 'true'
        with:
          path: C:\occt
          key: occt-windows-${{ hashFiles('tools/occt.sh') }}
      - uses: actions/cache/restore@v4
        id: draco
        with:
          path: C:\draco
          key: draco-windows-${{ hashFiles('tools/draco.sh') }}
      - name: Draco (statique, D-30)
        if: steps.draco.outputs.cache-hit != 'true'
        shell: bash
        run: |
          tools/draco.sh /c/draco
          rm -rf /c/draco-work
      - uses: actions/cache/save@v4
        if: steps.draco.outputs.cache-hit != 'true'
        with:
          path: C:\draco
          key: draco-windows-${{ hashFiles('tools/draco.sh') }}
      - name: Variables des bibliothèques
        shell: bash
        run: |
          echo "OCCT_DIR=C:\occt" >> "$GITHUB_ENV"
          echo "OBV_REQUIRE_OCCT=1" >> "$GITHUB_ENV"
          echo "DRACO_DIR=C:\draco" >> "$GITHUB_ENV"
          echo "OBV_REQUIRE_DRACO=1" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'tools/occt.sh', 'tools/draco.sh') }}
      - name: Analyse (clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Construction
        run: cargo build --workspace --release
      - name: Exécutable
        uses: actions/upload-artifact@v4
        with:
          name: obview-windows
          path: target/release/obview.exe

  macos:
    name: macOS (Apple Silicon, KosmicKrisp)
    runs-on: macos-26
    timeout-minutes: 300
    env:
      MACOSX_DEPLOYMENT_TARGET: "26.0"
      VULKAN_SDK_VERSION: 1.4.363.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: sdk
        with:
          path: ~/VulkanSDK
          key: vulkan-sdk-macos-${{ env.VULKAN_SDK_VERSION }}
      - name: SDK Vulkan (chargeur, KosmicKrisp, glslangValidator)
        if: steps.sdk.outputs.cache-hit != 'true'
        run: tools/macos-sdk.sh "$VULKAN_SDK_VERSION" ~/VulkanSDK
      - name: Outils
        run: |
          brew install ninja || true
          echo "VULKAN_SDK=$HOME/VulkanSDK/macOS" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        id: occt
        with:
          path: ~/occt
          key: occt-macos-${{ hashFiles('tools/occt.sh') }}
      - name: OpenCASCADE (statique, D-27)
        if: steps.occt.outputs.cache-hit != 'true'
        run: |
          OCCT_JOBS=$(sysctl -n hw.ncpu) tools/occt.sh ~/occt
          rm -rf ~/occt-work
      - uses: actions/cache/save@v4
        if: steps.occt.outputs.cache-hit != 'true'
        with:
          path: ~/occt
          key: occt-macos-${{ hashFiles('tools/occt.sh') }}
      - uses: actions/cache/restore@v4
        id: draco
        with:
          path: ~/draco
          key: draco-macos-${{ hashFiles('tools/draco.sh') }}
      - name: Draco (statique, D-30)
        if: steps.draco.outputs.cache-hit != 'true'
        run: |
          tools/draco.sh ~/draco
          rm -rf ~/draco-work
      - uses: actions/cache/save@v4
        if: steps.draco.outputs.cache-hit != 'true'
        with:
          path: ~/draco
          key: draco-macos-${{ hashFiles('tools/draco.sh') }}
      - name: Variables des bibliothèques
        run: |
          echo "OCCT_DIR=$HOME/occt" >> "$GITHUB_ENV"
          echo "OBV_REQUIRE_OCCT=1" >> "$GITHUB_ENV"
          echo "DRACO_DIR=$HOME/draco" >> "$GITHUB_ENV"
          echo "OBV_REQUIRE_DRACO=1" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'tools/occt.sh', 'tools/draco.sh') }}
      - name: Analyse (clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Construction
        run: cargo build --release -p obview
      - name: Application
        run: tools/macos-app.sh target/release/obview "$(cargo pkgid -p obview | sed 's/.*[#@]//')" "$VULKAN_SDK" dist
      # Information seulement : les machines virtuelles de GitHub n'offrent pas forcément Metal 4. Chargeur et
      # pilote de l'application ; « env » pose DYLD_LIBRARY_PATH après le lancement des outils protégés par SIP.
      - name: Pilote KosmicKrisp sur la machine de construction
        continue-on-error: true
        run: |
          app="$PWD/dist/Obview 3D.app"
          env DYLD_LIBRARY_PATH="$app/Contents/Frameworks" \
            VK_DRIVER_FILES="$app/Contents/Resources/vulkan/icd.d/libkosmickrisp_icd.json" \
            "$VULKAN_SDK/bin/vulkaninfo" --summary
          env DYLD_LIBRARY_PATH="$app/Contents/Frameworks" \
            VK_DRIVER_FILES="$app/Contents/Resources/vulkan/icd.d/libkosmickrisp_icd.json" \
            cargo test --release -p obv-gpu -p obview
      - name: Rendus des essais macOS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendus-macos
          path: target/tmp/rendus
          if-no-files-found: ignore
      - name: Archive
        run: ditto -c -k --keepParent "dist/Obview 3D.app" obview-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: obview-macos
          path: obview-macos.zip
